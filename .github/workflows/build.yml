name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch the Create Fly Recipe Viewer jar this mod nests
        env:
          VIEWER_JAR_NAME: CreateReiViewer-1.0.0-fly.26.2-beta.4+fabric-mc26.2.jar
          VIEWER_JAR_URL: https://github.com/chaevsfe/CreateReiViewer-Fly/releases/download/1.0.0-fly.26.2-beta.4/CreateReiViewer-1.0.0-fly.26.2-beta.4%2Bfabric-mc26.2.jar
        run: |
          mkdir -p libs
          curl -fsSL -o "libs/$VIEWER_JAR_NAME" "$VIEWER_JAR_URL"

      - name: Build from scratch
        run: ./gradlew clean build --no-build-cache --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: struts-fabric-26.2
          path: build/libs/*.jar
          if-no-files-found: error
