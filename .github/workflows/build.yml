name: Build

on:
  push:
    branches: [fabric-26.2]
  pull_request:
    branches: [fabric-26.2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build from scratch
        run: ./gradlew clean build --no-build-cache --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: struts-fabric-26.2
          path: build/libs/*.jar
          if-no-files-found: error
